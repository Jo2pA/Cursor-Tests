name: Claude Code

# トップレベルは権限なし。必要な権限はジョブだけに付ける。
permissions: {}

# issue_comment と pull_request_review_comment だけ。
# schedule / push / pull_request / pull_request_target では起動しない。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# リポジトリ全体で同時に 1 本。実行中のジョブはキャンセルしない。
concurrency:
  group: claude-code-action
  cancel-in-progress: false

jobs:
  claude:
    # @claude を含み、コメント作成者の author_association が OWNER のときだけ。
    if: github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # id-token は付けない。上の job permissions に束縛されたトークンを渡す。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Glob,Grep,Edit,Bash(git diff:*),Bash(git status:*)"
            --disallowedTools "Bash(git push:*),Bash(git rm:*)"
